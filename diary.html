<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saint Patrick Diary</title>
  <link rel="stylesheet" href="./diary.css">
  <script type="module" src="./diary.js"></script>
</head>
<body>
  <header class="castle">
    <div class="wrap">
      <nav class="diary-navigation" aria-label="Main navigation">
        <a href="./">← Back to the ritual</a>
        <a href="https://webappngdsib.github.io/St-Patrick/">Saint Patrick Website</a>
      </nav>
      <div class="hero">
        <h1>Saint Patrick Diary</h1>
        <button class="gold" id="new-entry" disabled>+ New entry</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p id="legacy-tools" hidden><button type="button" id="publish-legacy">Publish previous browser entries</button></p>
    <p id="diary-status" role="status"></p>
    <section aria-labelledby="upcoming-title">
      <h2 id="upcoming-title">Upcoming events</h2>
      <ol class="entries" id="upcoming"></ol>
      <p class="empty" id="upcoming-empty" hidden>No upcoming events.</p>
    </section>
    <section aria-labelledby="past-title">
      <h2 id="past-title">Past events</h2>
      <ol class="entries" id="past"></ol>
      <p class="empty" id="past-empty" hidden>No past events.</p>
    </section>
  </main>
  <dialog id="entry-dialog" aria-labelledby="entry-title">
    <form id="entry-form">
      <h2 id="entry-title">New diary entry</h2>
      <p>Published entries and photographs are public.</p>
      <label>Date <input name="date" type="date" required></label>
      <label>Location <input name="location" type="text" maxlength="160" required></label>
      <label>Lodge
        <select name="chamber" required>
          <option value="" selected disabled>Select a Lodge</option>
          <option value="Limerick Lodge">Limerick Lodge</option>
          <option value="Downpatrick Lodge">Downpatrick Lodge</option>
          <option value="Buru Lodge">Buru Lodge</option>
          <option value="Florida Lodge T.I.">Florida Lodge T.I.</option>
          <option value="Lorica Lodge T.I.">Lorica Lodge T.I.</option>
          <option value="Eri Lodge T.I.">Eri Lodge T.I.</option>
          <option value="Athenian Shamrock">Athenian Shamrock — Athens, Greece (Charter: December 2026, Corfu)</option>
        </select>
      </label>
      <label>Photographs <small>Optional · up to 3 · 10 MB each</small>
        <input name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" multiple>
      </label>
      <label id="publisher-key-label">Publishing key
        <input id="publisher-key" type="password" autocomplete="off" spellcheck="false" required>
        <small>Use a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub key</a> for this repository with Contents read and write access. The key stays in this tab until you reload or leave.</small>
      </label>
      <p id="form-error" role="alert"></p>
      <div class="form-actions">
        <button type="button" id="cancel">Cancel</button>
        <button class="gold" type="submit" id="save">Publish entry</button>
      </div>
    </form>
  </dialog>
</body>
</html>
