<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Masonic Order of Saint Patrick — Ritual Presentation</title>
    <meta
      name="description"
      content="Mobile-friendly interactive ritual presentation for The Masonic Order of Saint Patrick with role highlighting, tap-to-zoom dark green rubrics, and Greek translations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #101713;
        --ink-soft: #26342c;
        --emerald: #006b3f;
        --emerald-deep: #033b27;
        --emerald-glow: #18a96b;
        --gold: #c8a24a;
        --gold-soft: #ead8a4;
        --parchment: #f4efe3;
        --paper: #fffaf0;
        --mist: #e8efe9;
        --crimson: #9f1e2e;
        --line: rgba(16, 23, 19, 0.14);
        --shadow: 0 24px 80px rgba(3, 59, 39, 0.18);
        --radius: 12px;
        --serif: "Cinzel", Georgia, serif;
        --sans: "Inter", system-ui, -apple-system, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 0%, rgba(200, 162, 74, 0.18), transparent 36rem),
          linear-gradient(180deg, #fbf7ec 0%, #eef4ed 46%, #fbf7ec 100%);
        font-family: var(--sans);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      /* Sticky Header & Role Selector Bar */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(251, 247, 236, 0.94);
        border-bottom: 1px solid rgba(0, 107, 63, 0.18);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .header-inner {
        width: min(1120px, calc(100% - 1.5rem));
        margin-inline: auto;
        padding: 0.7rem 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        text-decoration: none;
        color: inherit;
      }

      .brand-crest {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--emerald-deep), var(--emerald));
        border: 2px solid var(--gold);
        display: grid;
        place-items: center;
        color: var(--gold-soft);
        font-family: var(--serif);
        font-weight: 800;
        font-size: 0.95rem;
        flex-shrink: 0;
      }

      .brand strong {
        display: block;
        font-family: var(--serif);
        font-size: clamp(0.95rem, 2.2vw, 1.15rem);
        color: var(--emerald-deep);
        line-height: 1.1;
      }

      .brand small {
        display: block;
        color: var(--emerald);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .role-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        flex: 1 1 auto;
        justify-content: flex-end;
      }

      .role-select-wrap {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        background: var(--paper);
        border: 1.5px solid var(--emerald);
        border-radius: 999px;
        padding: 0.3rem 0.75rem;
        box-shadow: 0 4px 14px rgba(3, 59, 39, 0.08);
      }

      .role-select-wrap label {
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--emerald-deep);
        white-space: nowrap;
      }

      select#role-selector {
        border: none;
        background: transparent;
        font-family: var(--sans);
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
        outline: none;
        padding-right: 0.25rem;
      }

      .btn-pill {
        border: 1px solid rgba(0, 107, 63, 0.25);
        background: var(--paper);
        color: var(--emerald-deep);
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
      }

      .btn-pill:hover {
        background: rgba(0, 107, 63, 0.08);
        border-color: var(--emerald);
      }

      .btn-pill.primary {
        background: var(--emerald-deep);
        color: var(--gold-soft);
        border-color: var(--gold);
      }

      .btn-pill.primary:hover {
        background: var(--emerald);
        color: #fff;
      }

      .btn-pill:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Welcome Banner */
      .welcome-banner {
        display: none;
        background: linear-gradient(90deg, var(--emerald-deep), #064d32);
        color: #fff;
        border-bottom: 2px solid var(--gold);
      }

      .welcome-banner.visible {
        display: block;
      }

      .welcome-inner {
        width: min(1120px, calc(100% - 1.5rem));
        margin-inline: auto;
        padding: 0.65rem 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .welcome-text {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.98rem;
      }

      .welcome-badge {
        background: var(--gold);
        color: var(--ink);
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
      }

      .welcome-text strong {
        font-family: var(--serif);
        color: var(--gold-soft);
        font-size: 1.08rem;
        letter-spacing: 0.02em;
      }

      /* Hero Section */
      .hero {
        position: relative;
        background: linear-gradient(135deg, var(--emerald-deep) 0%, #05261a 100%);
        color: #fff;
        padding: clamp(2.2rem, 5vw, 3.6rem) 0;
        border-bottom: 3px solid var(--gold);
      }

      .hero-inner {
        width: min(1120px, calc(100% - 1.5rem));
        margin-inline: auto;
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        color: var(--gold);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--serif);
        line-height: 1.15;
      }

      h1 {
        font-size: clamp(1.9rem, 5vw, 3.3rem);
        letter-spacing: -0.02em;
      }

      .hero-sub {
        margin: 0.85rem 0 0;
        max-width: 68ch;
        color: rgba(255, 255, 255, 0.85);
        font-size: clamp(0.98rem, 2vw, 1.12rem);
      }

      .hero-tips {
        margin-top: 1.4rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
      }

      .tip-chip {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(200, 162, 74, 0.4);
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        font-size: 0.8rem;
        color: var(--gold-soft);
      }

      /* Main Container */
      .container {
        width: min(1120px, calc(100% - 1.5rem));
        margin-inline: auto;
        padding: 1.75rem 0 4rem;
      }

      /* Chamber Layout & Roster Card */
      .chamber-card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: clamp(1.1rem, 3vw, 1.75rem);
        margin-bottom: 2rem;
      }

      .chamber-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding-bottom: 0.9rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 1.25rem;
      }

      .chamber-header h2 {
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        color: var(--emerald-deep);
      }

      .chamber-grid {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 1.5rem;
        align-items: start;
      }

      @media (max-width: 820px) {
        .chamber-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Interactive Visual Floor Diagram */
      .floor-diagram {
        background: linear-gradient(160deg, #f9f5eb, #eae3d2);
        border: 1.5px solid rgba(200, 162, 74, 0.55);
        border-radius: var(--radius);
        padding: 1rem;
      }

      .floor-label {
        text-align: center;
        font-family: var(--serif);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--emerald-deep);
        text-transform: uppercase;
        margin-bottom: 0.65rem;
      }

      .east-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
        max-width: 280px;
        margin: 0 auto 0.65rem;
      }

      .chamber-middle {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 0.6rem;
        align-items: center;
      }

      .checkered-pavement {
        position: relative;
        border: 3px solid var(--ink);
        border-radius: 6px;
        padding: 0.9rem 0.75rem;
        background-color: #ffffff;
        background-image:
          linear-gradient(45deg, rgba(16, 23, 19, 0.14) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(16, 23, 19, 0.14) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(16, 23, 19, 0.14) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(16, 23, 19, 0.14) 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1rem;
        min-height: 270px;
      }

      .pavement-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
      }

      .altar-box {
        margin: 0 auto;
        width: 112px;
        padding: 0.55rem 0.4rem;
        background: var(--paper);
        border: 2px solid var(--gold);
        border-radius: 6px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      }

      .altar-cross {
        font-size: 1.15rem;
        color: var(--emerald-deep);
        font-weight: 800;
        line-height: 1;
      }

      .altar-box span {
        display: block;
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
        margin-top: 0.2rem;
      }

      .west-row {
        max-width: 150px;
        margin: 0.65rem auto 0;
      }

      .station-node {
        background: var(--paper);
        border: 1.5px solid var(--emerald);
        border-radius: 8px;
        padding: 0.4rem 0.45rem;
        text-align: center;
        box-shadow: 0 3px 8px rgba(3, 59, 39, 0.1);
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        cursor: pointer;
      }

      .station-node .num {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        border-radius: 50%;
        background: var(--emerald-deep);
        color: var(--gold-soft);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .station-node .st-title {
        display: block;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--ink);
        margin-top: 0.15rem;
        line-height: 1.2;
      }

      .station-node.active-station {
        background: var(--emerald-deep);
        border-color: var(--gold);
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(0, 107, 63, 0.35);
      }

      .station-node.active-station .num {
        background: var(--gold);
        color: var(--ink);
      }

      .station-node.active-station .st-title {
        color: #fff;
      }

      /* Officers Roster Table */
      .roster-list {
        display: grid;
        gap: 0.45rem;
      }

      .roster-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.55rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .roster-item:hover {
        border-color: var(--emerald);
        background: rgba(0, 107, 63, 0.05);
      }

      .roster-item.selected-officer {
        background: linear-gradient(90deg, rgba(0, 107, 63, 0.14), rgba(200, 162, 74, 0.16));
        border: 2px solid var(--emerald);
      }

      .roster-role {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 700;
        color: var(--emerald-deep);
        font-size: 0.92rem;
      }

      .roster-num {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--emerald);
        color: #fff;
        font-size: 0.76rem;
        font-weight: 800;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .roster-name {
        font-weight: 800;
        color: var(--ink);
        font-size: 0.95rem;
        text-align: right;
      }

      .equipment-notes {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-left: 3px solid var(--gold);
        background: rgba(200, 162, 74, 0.12);
        border-radius: 0 8px 8px 0;
        font-size: 0.86rem;
        color: var(--ink-soft);
      }

      .equipment-notes strong {
        color: var(--emerald-deep);
      }

      /* Section Navigation Pills */
      .act-nav {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        margin-bottom: 1.5rem;
        scrollbar-width: thin;
      }

      .act-nav a {
        flex-shrink: 0;
        padding: 0.5rem 0.95rem;
        border-radius: 999px;
        background: var(--paper);
        border: 1px solid var(--line);
        color: var(--emerald-deep);
        font-weight: 800;
        font-size: 0.82rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }

      .act-nav a:hover {
        background: var(--emerald-deep);
        color: var(--gold-soft);
        border-color: var(--emerald-deep);
      }

      /* Ritual Sections & Dialogue Blocks */
      .ritual-section {
        margin-bottom: 2.5rem;
        scroll-margin-top: 7.5rem;
      }

      .section-banner {
        background: linear-gradient(135deg, var(--emerald-deep), #07291d);
        color: #fff;
        padding: 1rem 1.25rem;
        border-radius: var(--radius) var(--radius) 0 0;
        border-bottom: 2px solid var(--gold);
      }

      .section-banner .eyebrow {
        margin-bottom: 0.2rem;
      }

      .section-banner h2 {
        font-size: clamp(1.2rem, 3.2vw, 1.7rem);
      }

      .ritual-stream {
        background: var(--paper);
        border: 1px solid var(--line);
        border-top: none;
        border-radius: 0 0 var(--radius) var(--radius);
        padding: clamp(0.9rem, 2.5vw, 1.5rem);
        display: grid;
        gap: 1.1rem;
        box-shadow: 0 14px 40px rgba(3, 59, 39, 0.08);
      }

      /* Dark Green Rubric (Stage Directions) — Click/Tap to Zoom Larger */
      .rubric {
        position: relative;
        padding: 0.85rem 1rem;
        border-left: 4px solid var(--emerald);
        border-radius: 0 8px 8px 0;
        background: rgba(0, 107, 63, 0.06);
        color: #006b3f;
        font-style: italic;
        font-weight: 600;
        font-size: 0.98rem;
        line-height: 1.6;
        cursor: pointer;
        transition:
          transform 0.22s ease,
          font-size 0.22s ease,
          padding 0.22s ease,
          background 0.22s ease,
          box-shadow 0.22s ease;
        user-select: none;
      }

      .rubric::after {
        content: "🔍 Tap to zoom";
        display: inline-block;
        margin-left: 0.6rem;
        font-style: normal;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--emerald-deep);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 107, 63, 0.25);
        padding: 0.12rem 0.45rem;
        border-radius: 999px;
        vertical-align: middle;
      }

      .rubric.zoomed {
        font-size: clamp(1.25rem, 3.8vw, 1.55rem);
        font-style: normal;
        font-weight: 700;
        line-height: 1.55;
        padding: 1.25rem 1.35rem;
        background: #e3f3eb;
        color: #024b2c;
        border-left-width: 6px;
        border-color: var(--gold);
        box-shadow: 0 14px 36px rgba(3, 59, 39, 0.22);
        transform: scale(1.01);
        z-index: 10;
      }

      .rubric.zoomed::after {
        content: "✕ Tap to minimize";
        background: var(--emerald-deep);
        color: var(--gold-soft);
        border-color: var(--gold);
      }

      /* Speech Cards */
      .speech-card {
        padding: 1rem 1.15rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #ffffff;
        transition: all 0.22s ease;
      }

      .speech-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.55rem;
        padding-bottom: 0.45rem;
        border-bottom: 1px solid rgba(16, 23, 19, 0.08);
      }

      .speaker-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.45rem;
      }

      .speaker-title {
        font-family: var(--serif);
        font-weight: 800;
        font-size: 1.02rem;
        color: var(--emerald-deep);
        letter-spacing: 0.02em;
      }

      .speaker-officer-name {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--emerald);
        background: rgba(0, 107, 63, 0.08);
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
      }

      /* Bullet Button on Right of Title to Toggle Greek Translation */
      .greek-bullet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        min-width: 2.35rem;
        height: 2.1rem;
        padding: 0 0.6rem;
        border-radius: 999px;
        border: 1.5px solid var(--emerald);
        background: var(--paper);
        color: var(--emerald-deep);
        font-weight: 800;
        font-size: 0.8rem;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.18s ease;
      }

      .greek-bullet .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--emerald);
        transition: background 0.18s ease, transform 0.18s ease;
      }

      .greek-bullet:hover {
        background: rgba(0, 107, 63, 0.1);
      }

      .greek-bullet[aria-expanded="true"] {
        background: var(--emerald-deep);
        border-color: var(--gold);
        color: var(--gold-soft);
      }

      .greek-bullet[aria-expanded="true"] .dot {
        background: var(--gold);
        transform: scale(1.2);
      }

      .speech-en {
        color: var(--ink);
        font-size: 1.03rem;
        line-height: 1.72;
      }

      .speech-en p {
        margin: 0 0 0.65rem;
      }

      .speech-en p:last-child {
        margin-bottom: 0;
      }

      .speech-en .inline-rubric {
        color: #006b3f;
        font-style: italic;
        font-weight: 700;
        cursor: pointer;
        padding: 0.05rem 0.25rem;
        border-radius: 4px;
        background: rgba(0, 107, 63, 0.07);
        transition: all 0.2s ease;
      }

      .speech-en .inline-rubric.zoomed {
        display: inline-block;
        font-size: 1.25em;
        font-style: normal;
        padding: 0.25rem 0.5rem;
        background: #dff2e8;
        border: 1px solid var(--gold);
      }

      /* Greek Translation Box (Hidden until Bullet Pressed) */
      .speech-el {
        display: none;
        margin-top: 0.85rem;
        padding: 0.85rem 1rem;
        border-radius: 8px;
        background: linear-gradient(160deg, #f3f7f4, #e7efe9);
        border-left: 3.5px solid var(--gold);
        color: var(--emerald-deep);
        font-size: 0.98rem;
        line-height: 1.7;
      }

      .speech-el.open {
        display: block;
        animation: fadeSlide 0.2s ease;
      }

      .speech-el-label {
        display: block;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--emerald);
        margin-bottom: 0.35rem;
      }

      .speech-el p {
        margin: 0 0 0.55rem;
      }

      .speech-el p:last-child {
        margin-bottom: 0;
      }

      /* Selected Role Highlighting: More Bold & One Size Bigger */
      .speech-card.is-my-role {
        border: 2.5px solid var(--emerald);
        background: linear-gradient(165deg, #fffdf7 0%, #eef6f0 100%);
        box-shadow: 0 12px 32px rgba(0, 107, 63, 0.16);
      }

      .speech-card.is-my-role .speaker-title {
        font-size: 1.22rem;
        color: var(--emerald);
      }

      .speech-card.is-my-role .speech-en {
        font-size: 1.2rem;
        font-weight: 700;
        color: #09120d;
      }

      .speech-card.is-my-role .speech-el {
        font-size: 1.14rem;
        font-weight: 600;
      }

      /* Prayer / Psalm Verse Styling */
      .verse-block {
        padding: 0.75rem 1rem;
        border-left: 3px solid var(--gold);
        background: rgba(244, 239, 227, 0.65);
        border-radius: 0 8px 8px 0;
        margin: 0.5rem 0;
      }

      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Footer */
      .site-footer {
        background: #06140f;
        color: rgba(255, 255, 255, 0.78);
        padding: 2rem 1rem;
        text-align: center;
        border-top: 2px solid var(--gold);
      }

      .site-footer strong {
        color: var(--gold-soft);
        font-family: var(--serif);
      }

      @media (max-width
